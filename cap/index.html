<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ยอดลัง T+1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#1d2330;--muted:#5d6678;--faint:#8a93a5;--line:#e3e6ec;
  --ok:#1a7f4b;--ok-bg:#e4f5ec;--warn:#9a6700;--warn-bg:#fdf3d8;--stop:#c53030;--stop-bg:#fde8e8;
  --bar:#cfd5df;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151c;--card:#1b2029;--text:#eef1f6;--muted:#a6afc0;--faint:#7c8597;--line:#2a313d;
    --ok:#4cc38a;--ok-bg:#16301f;--warn:#e9b949;--warn-bg:#33290f;--stop:#ff7b7b;--stop-bg:#3a1a1a;
    --bar:#3a4252;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:"Kanit",sans-serif;font-size:15px;font-weight:600;color:var(--muted);margin:4px 0 12px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:12px}
.hero{border-radius:16px;padding:20px 18px;background:var(--ok-bg);color:var(--ok)}
.hero.warn{background:var(--warn-bg);color:var(--warn)}
.hero.stop{background:var(--stop-bg);color:var(--stop)}
.status{font-family:"Kanit",sans-serif;font-weight:800;font-size:30px;line-height:1.15}
.big{font-family:"Kanit",sans-serif;font-weight:800;font-size:64px;line-height:1.1;margin-top:8px}
.big small{font-size:22px;font-weight:600;opacity:.85}
.plus{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.plus span{font-family:"Kanit",sans-serif;font-weight:700;font-size:19px;background:rgba(127,127,127,.16);border-radius:8px;padding:1px 10px}
.plusnote{font-size:12px;opacity:.85;margin-top:6px}
.remain{font-weight:600;margin-top:8px}
.track{position:relative;height:14px;border-radius:7px;background:var(--bar);margin-top:14px;overflow:hidden}
.fill{height:100%;border-radius:7px;background:currentColor}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.55}
.scale{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:4px}
.snap{color:var(--muted);font-size:13px;margin:12px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-family:"Kanit",sans-serif;font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.zrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.zname{width:92px;font-weight:700;font-size:13px;white-space:nowrap}
.zbar{flex:1;height:10px;background:var(--bar);border-radius:5px;overflow:hidden}
.zbar i{display:block;height:100%;background:var(--muted);border-radius:5px}
.zval{width:64px;text-align:right;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.note{color:var(--faint);font-size:12px;margin:14px 2px 24px}
.alert{background:var(--stop-bg);color:var(--stop);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div id="stale" class="banner" hidden></div>
  <div id="hero" class="hero">
    <div class="status" id="status"></div>
    <div class="big"><span id="total"></span> <small id="limit"></small></div>
    <div class="plus" id="plus"></div>
    <div class="remain" id="remain"></div>
    <div class="track"><div class="fill" id="fill"></div><div class="mark" id="markWarn"></div><div class="mark" id="markLimit"></div></div>
    <div class="scale"><span>0</span><span id="legend"></span></div>
  </div>
  <div class="snap" id="snap"></div>
  <div id="partial" class="alert" hidden></div>
  <div class="card" id="zoneCard"><h2>แยกตามโซน (ลัง)</h2><div id="zones"></div></div>
  <div class="note">ยอดนับจากออเดอร์ที่คีย์แล้ว ณ เวลาที่แสดง อัปเดตรอบ 11:15 และ 14:00 วันทำงาน ออเดอร์ที่คีย์หลังจากนั้นยังไม่รวม</div>
</div>
<script>
const D={"generatedAt":"2026-10-08 16:43","targetDate":"2026-10-09","totalCtn":278,"limit":500,"unmappedRows":0,"lineCount":104,"byZone":{"AY":170,"BK":67,"CB":24,"KR":0,"PRJ":16,"RY":1,"SMP":0,"UNMAPPED":0},"nonCtnUnits":{"BAG":10,"BOX":11,"BTL":10,"MAT":720,"PCS":385,"PRS":263,"ROLL":7,"YARD":729},"warnAt":400,"resumeBelow":490,"level":"ok"};
const WD=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const MO=["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const fmt=n=>Number(n).toLocaleString("en-US");
function label(iso){const p=iso.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);return "วัน"+WD[d.getDay()]+"ที่ "+p[2]+" "+MO[p[1]]+" "+p[0]}
const el=id=>document.getElementById(id);
el("title").textContent="ยอดลังจัดส่ง · "+label(D.targetDate);
const names={ok:"คีย์ต่อได้",warn:"ใกล้เต็ม ระวังการคีย์เพิ่ม",stop:"หยุดคีย์ออเดอร์จัดส่ง"};
el("hero").className="hero "+(D.level==="ok"?"":D.level);
el("status").textContent=names[D.level]||names.ok;
el("total").textContent=fmt(D.totalCtn);
el("limit").textContent="/ "+fmt(D.limit)+" ลัง";
const diff=D.limit-D.totalCtn;
el("remain").textContent=diff>=0?("เหลืออีก "+fmt(diff)+" ลัง"):("เกินเพดาน "+fmt(-diff)+" ลัง");
const maxScale=Math.max(D.limit*1.15,D.totalCtn*1.02);
el("fill").style.width=Math.min(100,D.totalCtn/maxScale*100)+"%";
el("markWarn").style.left=(D.warnAt/maxScale*100)+"%";
el("markLimit").style.left=(D.limit/maxScale*100)+"%";
el("legend").textContent="ขีดแรก = เตือนที่ "+fmt(D.warnAt)+" · ขีดหลัง = เพดาน "+fmt(D.limit)+" ลัง";
const hhmm=D.generatedAt.split(" ")[1];
el("snap").textContent="ยอด ณ เวลา "+hhmm+" น. (วันที่ "+D.generatedAt.split(" ")[0]+")";
const pad=n=>String(n).padStart(2,"0");const now=new Date();
const today=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
if(D.generatedAt.split(" ")[0]!==today){const s=el("stale");s.hidden=false;s.textContent="ข้อมูลนี้ไม่ใช่ของวันนี้ (อัปเดตล่าสุด "+D.generatedAt+") — อย่าใช้ตัดสินใจ รอรอบอัปเดตถัดไป"}
if(D.unmappedRows>0){const a=el("partial");a.hidden=false;a.textContent="มี "+D.unmappedRows+" รายการที่คำนวณเป็นลังไม่ได้ ยอดจริงอาจสูงกว่านี้"}
const zs=Object.entries(D.byZone).sort((a,b)=>b[1]-a[1]);
const zmax=Math.max(1,...zs.map(z=>z[1]));
el("zones").innerHTML=zs.length?zs.map(z=>'<div class="zrow"><div class="zname">'+z[0]+'</div><div class="zbar"><i style="width:'+(z[1]/zmax*100)+'%"></i></div><div class="zval">'+fmt(z[1])+'</div></div>').join(""):'<div class="zrow">ยังไม่มีออเดอร์</div>';
const os=Object.entries(D.nonCtnUnits).sort((a,b)=>b[1]-a[1]);
if(os.length){el("plus").innerHTML=os.map(o=>'<span>+ '+fmt(o[1])+' '+o[0]+'</span>').join("")+'<div class="plusnote" style="width:100%">หน่วยอื่นไม่ได้นับเข้าเพดาน '+fmt(D.limit)+' ลัง — ทีมประเมินความจุรถเอง</div>'}
</script>
</body>
</html>
