<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleanstat Dispatch Board</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f6;
      --ink: #16201d;
      --muted: #66736d;
      --line: #cbd8d2;
      --panel: #ffffff;
      --accent: #b8730a;
      --accent-2: #146c63;
      --ok: #16705a;
      --shadow: 0 10px 28px rgba(63, 45, 25, .11);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Tahoma", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 247, 246, .94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 10px;
    }
    .eyebrow {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    h1 {
      margin: 5px 0 10px;
      font-size: 28px;
      line-height: 1.12;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      min-width: 0;
    }
    .metric .label {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .metric .value {
      font-size: 20px;
      font-weight: 700;
    }
    nav {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 14px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      text-decoration: none;
      color: var(--ink);
      background: #e4ece8;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }
    nav a.active { background: var(--ink); color: #fffaf1; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
    }
    .notice {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent-2);
      background: #edf5f7;
      color: #214556;
      border-radius: 6px;
      font-size: 13px;
    }
    section.zone {
      margin: 0 0 18px;
      scroll-margin-top: 180px;
    }
    .zone-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid var(--ink);
      padding: 7px 0;
      margin-bottom: 10px;
    }
    .zone-title {
      font-size: 22px;
      font-weight: 800;
    }
    .zone-meta {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .customers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
    }
    article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .customer-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }
    .customer-name {
      font-size: 17px;
      font-weight: 800;
    }
    .subzone {
      color: var(--accent-2);
      font-size: 12px;
      margin-top: 2px;
    }
    .qty {
      background: #1f1b16;
      color: #fffaf1;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
    }
    li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid #e3ece8;
      font-size: 13px;
    }
    li .item-name { min-width: 0; }
    li .item-qty {
      color: var(--ok);
      font-weight: 800;
      white-space: nowrap;
    }
    .empty {
      color: var(--muted);
      padding: 16px 0;
      font-size: 14px;
    }
    footer {
      max-width: 980px;
      margin: 8px auto 30px;
      padding: 0 14px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 640px) {
      h1 { font-size: 24px; }
      .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric { padding: 8px; }
      .metric .value { font-size: 18px; }
      .metric .label { font-size: 10px; }
      main { padding: 12px 10px; }
      .customers { grid-template-columns: 1fr; }
      section.zone { scroll-margin-top: 170px; }
    }
  </style>
</head>
<body>

      nav.appendChild(link);
